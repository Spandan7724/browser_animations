<title>Chladni</title>
<link rel="stylesheet" href="piece.css">
<canvas id="panel"></canvas>
<script src="panel.js"></script>
<script>
(() => {
  'use strict';
  // A vibrating plate. Five standing modes of a rectangle are summed, each with
  // its own frequency, and what gets drawn is the set where the sum is zero:
  // the places that never move, where sand settles on a real plate. As the
  // modes drift out of phase the figure reorganises into a different one.
  //
  // Line width is held constant by dividing the field value by its gradient,
  // the same trick Contour uses, so a nodal line stays one width whether the
  // plate is steep there or nearly flat.
  const MODES = [
    { n: 3, m: 2, a: 1.00, w: 2, ph: 0.0 },
    { n: 5, m: 3, a: 0.72, w: 3, ph: 1.7 },
    { n: 2, m: 4, a: 0.60, w: 5, ph: 3.9 },
    { n: 7, m: 2, a: 0.44, w: 7, ph: 5.1 },
    { n: 4, m: 5, a: 0.36, w: 11, ph: 2.3 },
  ];
  const LINE_IN = 0.22, LINE_OUT = 0.78;
  const FLOOR = 0.05;
  const DRIVE = 2.2, DRIVE_R2 = 2 * 4.5 * 4.5;

  Panel.create({
    loop: 24,
    rows: 24, pitchX: 12, pitchY: 10, cellW: 10.5, cellH: 8.5, radius: 3,
    scaleMin: 0.20, scaleExp: 0.7, alphaMin: 0.06,

    init(g) {
      g.L = g.cols;
      g.H = g.rows;
      g.norm = 1 / MODES.reduce((s, q) => s + q.a, 0);
    },
    frame(g, t) { g.w = 2 * Math.PI * t / g.loop; },

    value(g, c, r, t) {
      const x = (c + 0.5) / g.L, y = (r + 0.5) / g.H;   // 0..1 across the plate
      let v = 0, gx = 0, gy = 0;

      for (let i = 0; i < MODES.length; i += 1) {
        const q = MODES[i];
        const kx = q.n * Math.PI, ky = q.m * Math.PI;
        const sx = Math.sin(kx * x), sy = Math.sin(ky * y);
        const amp = q.a * Math.cos(q.w * g.w + q.ph);
        v += amp * sx * sy;
        gx += amp * kx * Math.cos(kx * x) * sy / g.L;
        gy += amp * ky * sx * Math.cos(ky * y) / g.H;
      }
      v *= g.norm; gx *= g.norm; gy *= g.norm;

      // A finger on the plate drives it locally, and the nodal lines swing
      // away from it in time with the driving rather than sitting still.
      const push = (px, py, amp) => {
        const dx = c - px, dy = (r - py) * (g.pitchY / g.pitchX);
        const e = amp * Math.exp(-(dx * dx + dy * dy) / DRIVE_R2);
        v += e;
        gx += -e * dx * 2 / DRIVE_R2;
        gy += -e * dy * 2 / DRIVE_R2;
      };
      if (g.pointer.active) {
        push(g.pointer.x, g.pointer.y, DRIVE * 0.32 * Math.cos(9.2 * g.now));
      }
      for (let i = 0; i < g.impulses.length; i += 1) {
        const im = g.impulses[i];
        const age = g.now - im.t0;
        if (age > 3.5) continue;
        push(im.x, im.y, DRIVE * im.strength * Math.exp(-age / 1.3) * Math.cos(9.2 * g.now));
      }

      const grad = Math.sqrt(gx * gx + gy * gy) + 1e-4;
      const dist = Math.abs(v) / grad;               // cells to the nodal line
      return FLOOR + (1 - FLOOR) * (1 - g.smoothstep(LINE_IN, LINE_OUT, dist));
    },
  });
})();
</script>
