<title>Swell</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  #panel {
    display: block;
    cursor: crosshair;
    touch-action: none;
  }
</style>

<canvas id="panel"></canvas>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------
  // Panel
  // ------------------------------------------------------------------
  // Character-cell proportions, in CSS pixels. A cell is a rounded slab in a
  // slightly larger box, so the gutters come out of the pitch.
  const PITCH_X = 13, PITCH_Y = 11;
  const CELL_W = 10, CELL_H = 8, RADIUS = 2;
  const ROWS = 20;
  const MAX_WIDTH = 720;
  const LEVELS = 96;

  // ------------------------------------------------------------------
  // Camera
  // ------------------------------------------------------------------
  // A ground plane under a camera of focal length f at height H: a row py
  // pixels below the horizon sits at z = f*H/py. Deriving both axes from the
  // one projection is what keeps the foreshortening honest; a hand-rolled
  // depth ramp lets the vertical and horizontal scales drift apart and the
  // surface collapses into horizontal streaks.
  const EYE_HEIGHT = 5.5;
  // The horizon sits just above the panel. Without that the top rows run off
  // to infinity and burn most of the panel on haze.
  const HORIZON_ROW = -0.80 * ROWS;

  // ------------------------------------------------------------------
  // Swell
  // ------------------------------------------------------------------
  // Eight components on a 24s loop, amplitude falling with wavelength the way
  // a wind sea's spectrum does. Deep-water dispersion sets each frequency,
  // then it is snapped to a whole multiple of the base so the sum closes
  // exactly rather than drifting. The headings share a dominant direction
  // with spread either side, which is what stops it reading as a plaid.
  const LOOP_SECONDS = 24;
  const BASE_OMEGA = 2 * Math.PI / LOOP_SECONDS;
  const GRAVITY = 9.81;
  const WAVES = [
    { amplitude: 1.00, wavelength: 3.840, heading: 1.20, phase: 0.0 },
    { amplitude: 0.75, wavelength: 2.368, heading: 0.85, phase: 1.7 },
    { amplitude: 0.55, wavelength: 1.472, heading: 1.55, phase: 3.9 },
    { amplitude: 0.41, wavelength: 0.912, heading: 0.55, phase: 5.2 },
    { amplitude: 0.30, wavelength: 0.560, heading: 1.85, phase: 2.4 },
    { amplitude: 0.22, wavelength: 0.346, heading: 0.35, phase: 4.6 },
  ].map((w) => {
    const k = 2 * Math.PI / w.wavelength;
    const harmonic = Math.max(1, Math.round(Math.sqrt(GRAVITY * k) / BASE_OMEGA));
    return {
      amplitude: w.amplitude,
      phase: w.phase,
      k,
      omega: harmonic * BASE_OMEGA,
      cos: Math.cos(w.heading),
      sin: Math.sin(w.heading),
    };
  });
  const NW = WAVES.length;

  // ------------------------------------------------------------------
  // Shading
  // ------------------------------------------------------------------
  const SIGMA = 1.75;         // standard deviations that fill the tonal range
  const NORM_FLOOR = 0.45;   // stops far rows amplifying their last component
  const TROUGH = 0.26;       // trough lift, applied before the gamma
  const BODY_GAMMA = 1.40;
  const BODY_GAIN = 0.92;
  const SPEC_LO = 0.50, SPEC_HI = 0.94, SPEC_GAIN = 0.42;
  const SLOPE_K_EXP = 0.6;   // glints track the waves you can see, not the finest chop
  const GLITTER_MID = 0.55;  // the glitter path sits mid-distance, not underfoot
  const GLITTER_WIDTH = 0.42;
  const CREST_LO = 0.54, CREST_HI = 0.92;
  const HAZE_LEVEL = 0.36, HAZE_STRENGTH = 0.45;

  // ------------------------------------------------------------------
  // Ripples
  // ------------------------------------------------------------------
  const RIPPLE_SPEED = 1.7;
  const RIPPLE_TAU = 2.2;
  const RIPPLE_K = 4.2;
  const RIPPLE_MAX_R = 9;
  const RIPPLE_H_GAIN = 1.35;
  const FOAM_GAIN = 0.75;
  const WAKE_INTERVAL = 0.09;
  const WAKE_STRENGTH = 0.34;
  const SPLASH_STRENGTH = 2.6;
  const MAX_RIPPLES = 36;

  const canvas = document.getElementById('panel');
  const ctx = canvas.getContext('2d', { alpha: false });

  let cols = 0, pxX = 0, pxY = 0, ratio = 1;
  let atlas = null;
  let rowData = [];
  const sinBuf = new Float64Array(NW);
  const cosBuf = new Float64Array(NW);

  const smoothstep = (e0, e1, x) => {
    const t = x <= e0 ? 0 : x >= e1 ? 1 : (x - e0) / (e1 - e0);
    return t * t * (3 - 2 * t);
  };

  // ------------------------------------------------------------------
  // Atlas: one tile per level. Value drives the slab's size and its alpha at
  // once, so a trough is a faint speck and a crest is a full lit block. That
  // pairing is what gives the surface its texture; alpha alone stays flat.
  // ------------------------------------------------------------------
  function buildAtlas() {
    const a = document.createElement('canvas');
    a.width = LEVELS * pxX;
    a.height = pxY;
    const g = a.getContext('2d');

    for (let i = 0; i < LEVELS; i += 1) {
      const u = i / (LEVELS - 1);
      const scale = 0.24 + 0.76 * Math.pow(u, 0.65);
      const w = CELL_W * ratio * scale;
      const h = CELL_H * ratio * scale;
      const x = i * pxX + (pxX - w) / 2;
      const y = (pxY - h) / 2;
      // The top of the range runs to pure white so glints separate from the
      // merely bright water under them.
      const tint = Math.round(230 + 25 * smoothstep(0.88, 1, u));
      g.fillStyle = `rgba(${tint},${tint},${tint},${(0.09 + 0.91 * u).toFixed(3)})`;
      g.beginPath();
      g.roundRect(x, y, w, h, RADIUS * ratio * Math.min(1, scale * 1.4));
      g.fill();
    }
    return a;
  }

  // ------------------------------------------------------------------
  // Layout
  // ------------------------------------------------------------------
  function layout() {
    ratio = Math.min(2, window.devicePixelRatio || 1);
    const avail = Math.min(MAX_WIDTH, Math.max(160, window.innerWidth - 48));
    cols = Math.max(12, Math.floor((avail + (PITCH_X - CELL_W)) / PITCH_X));

    const cssW = cols * PITCH_X - (PITCH_X - CELL_W);
    const cssH = ROWS * PITCH_Y - (PITCH_Y - CELL_H);
    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;
    canvas.width = Math.round(cssW * ratio);
    canvas.height = Math.round(cssH * ratio);

    pxX = Math.round(PITCH_X * ratio);
    pxY = Math.round(PITCH_Y * ratio);
    atlas = buildAtlas();
    ctx.imageSmoothingEnabled = false;

    const midCol = (cols - 1) / 2;
    const focal = ROWS * PITCH_Y;
    const zs = new Float64Array(ROWS);
    const xStep = new Float64Array(ROWS);
    for (let r = 0; r < ROWS; r += 1) {
      const py = Math.max(0.35 * PITCH_Y, (r - HORIZON_ROW + 0.5) * PITCH_Y);
      zs[r] = focal * EYE_HEIGHT / py;
      xStep[r] = PITCH_X * zs[r] / focal;
    }

    rowData = [];
    let hVarMax = 0, sVarMax = 0;

    for (let r = 0; r < ROWS; r += 1) {
      const t = (r + 0.5) / ROWS;
      const z = zs[r];
      const hi = Math.min(ROWS - 1, r + 1), lo = Math.max(0, r - 1);
      const span = (hi - lo) || 1;
      const dzdr = Math.abs((zs[hi] - zs[lo]) / span);
      const dxdr = Math.abs((xStep[hi] - xStep[lo]) / span);

      const base = new Float64Array(NW);
      const ds = new Float64Array(NW);
      const dc = new Float64Array(NW);
      const aw = new Float64Array(NW);
      const awk = new Float64Array(NW);
      let hVar = 0, sVar = 0;

      for (let i = 0; i < NW; i += 1) {
        const w = WAVES[i];
        const dth = w.k * w.cos * xStep[r];   // phase step per column
        // Anti-aliasing. A component whose projected period falls below a
        // couple of cells cannot be drawn, only aliased, so fade it out. That
        // is what turns the far rows into haze instead of noise, and why the
        // foreground carries chop the distance does not.
        const gradRow = Math.abs(w.k * w.sin * dzdr) +
                        Math.abs(w.k * w.cos * dxdr * midCol * 0.6);
        const grad = Math.max(Math.abs(dth), gradRow);
        const weight = 1 - smoothstep(Math.PI * 0.22, Math.PI * 0.60, grad);

        base[i] = w.k * w.sin * z - w.k * w.cos * xStep[r] * midCol + w.phase;
        ds[i] = Math.sin(dth);
        dc[i] = Math.cos(dth);
        aw[i] = w.amplitude * weight;
        awk[i] = aw[i] * Math.pow(w.k, SLOPE_K_EXP) * w.sin;
        hVar += aw[i] * aw[i];
        sVar += awk[i] * awk[i];
      }
      if (hVar > hVarMax) hVarMax = hVar;
      if (sVar > sVarMax) sVarMax = sVar;

      rowData.push({
        z, base, ds, dc, aw, awk, hVar, sVar,
        haze: Math.pow(1 - t, 1.6) * HAZE_STRENGTH,
        glitter: Math.exp(-Math.pow((t - GLITTER_MID) / GLITTER_WIDTH, 2)),
        xStep: xStep[r],
        xStart: -midCol * xStep[r],
      });
    }

    // Incoherent components never sum to their total, so the range is set from
    // the RMS. Per row, but floored against the strongest row: without that
    // floor the far rows, where only the long swell survives, stretch a lone
    // component across the whole range and band.
    for (const rd of rowData) {
      rd.hNorm = SIGMA * Math.sqrt(0.5 * Math.max(rd.hVar, NORM_FLOOR * hVarMax)) + 1e-6;
      rd.sNorm = SIGMA * Math.sqrt(0.5 * Math.max(rd.sVar, NORM_FLOOR * sVarMax)) + 1e-6;
    }
  }

  // ------------------------------------------------------------------
  // Ripples: transient, so the ambient swell keeps its exact 24s loop.
  // ------------------------------------------------------------------
  const ripples = [];
  let lastWake = 0;

  function addRipple(clientX, clientY, strength) {
    const box = canvas.getBoundingClientRect();
    const row = Math.max(0, Math.min(ROWS - 1, Math.floor((clientY - box.top) / PITCH_Y)));
    const rd = rowData[row];
    if (!rd) return;
    const x = rd.xStart + ((clientX - box.left) / PITCH_X) * rd.xStep;
    if (ripples.length >= MAX_RIPPLES) ripples.shift();
    ripples.push({ x, z: rd.z, t0: performance.now() / 1000, strength });
  }

  canvas.addEventListener('pointermove', (e) => {
    const now = performance.now() / 1000;
    if (now - lastWake < WAKE_INTERVAL) return;
    lastWake = now;
    addRipple(e.clientX, e.clientY, WAKE_STRENGTH);
  }, { passive: true });

  canvas.addEventListener('pointerdown', (e) => {
    addRipple(e.clientX, e.clientY, SPLASH_STRENGTH);
  }, { passive: true });

  // ------------------------------------------------------------------
  // Frame
  // ------------------------------------------------------------------
  function render(nowMs) {
    const time = nowMs / 1000 % LOOP_SECONDS;
    const nowSec = nowMs / 1000;

    for (let i = ripples.length - 1; i >= 0; i -= 1) {
      const rp = ripples[i];
      const age = nowSec - rp.t0;
      rp.front = RIPPLE_SPEED * age;
      if (rp.front > RIPPLE_MAX_R || age > RIPPLE_TAU * 4) { ripples.splice(i, 1); continue; }
      rp.width = 0.22 + 0.06 * rp.front;
      rp.amp = rp.strength * Math.exp(-age / RIPPLE_TAU) / (0.6 + rp.front);
      const inner = Math.max(0, rp.front - 3 * rp.width);
      const outer = rp.front + 3 * rp.width;
      rp.inner2 = inner * inner;
      rp.outer2 = outer * outer;
      rp.invW2 = 1 / (2 * rp.width * rp.width);
    }
    const nRip = ripples.length;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < ROWS; r += 1) {
      const rd = rowData[r];
      const { base, ds, dc, aw, awk } = rd;
      const z = rd.z, haze = rd.haze, glitter = rd.glitter;
      const invH = 1 / rd.hNorm, invS = 1 / rd.sNorm;
      const rippleH = rd.hNorm * RIPPLE_H_GAIN;
      const y = r * pxY;

      for (let i = 0; i < NW; i += 1) {
        const a = base[i] - WAVES[i].omega * time;
        sinBuf[i] = Math.sin(a);
        cosBuf[i] = Math.cos(a);
      }

      let wx = rd.xStart;

      for (let c = 0; c < cols; c += 1) {
        let h = 0, slope = 0;
        for (let i = 0; i < NW; i += 1) {
          h += aw[i] * sinBuf[i];
          slope += awk[i] * cosBuf[i];
        }
        // Advance every component one column by rotating its phasor rather
        // than calling sin and cos again. The cosine the slope needs is then
        // already in hand.
        for (let i = 0; i < NW; i += 1) {
          const s = sinBuf[i], co = cosBuf[i];
          sinBuf[i] = s * dc[i] + co * ds[i];
          cosBuf[i] = co * dc[i] - s * ds[i];
        }

        let foam = 0;
        for (let i = 0; i < nRip; i += 1) {
          const rp = ripples[i];
          const dx = wx - rp.x, dz = z - rp.z;
          const d2 = dx * dx + dz * dz;
          if (d2 > rp.outer2 || d2 < rp.inner2) continue;
          const off = Math.sqrt(d2) - rp.front;
          const e = rp.amp * Math.exp(-off * off * rp.invW2);
          h += e * Math.cos(RIPPLE_K * off) * rippleH;
          foam += e;
        }
        wx += rd.xStep;

        const hN = h * invH;
        const hC = hN < -1 ? -1 : hN > 1 ? 1 : hN;
        const sn = slope * invS;
        const body = Math.pow(TROUGH + (1 - TROUGH) * (0.5 + 0.5 * hC), BODY_GAMMA) * BODY_GAIN;
        const spec = smoothstep(SPEC_LO, SPEC_HI, sn) *
                     smoothstep(CREST_LO, CREST_HI, 0.5 + 0.5 * hC) * SPEC_GAIN * glitter;

        let u = body + spec + foam * FOAM_GAIN;
        u = u * (1 - haze) + HAZE_LEVEL * haze;
        const lvl = u <= 0 ? 0 : u >= 1 ? LEVELS - 1 : (u * (LEVELS - 1)) | 0;
        ctx.drawImage(atlas, lvl * pxX, 0, pxX, pxY, c * pxX, y, pxX, pxY);
      }
    }
  }

  // ------------------------------------------------------------------
  // Drive
  // ------------------------------------------------------------------
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  let frame = 0;
  let onScreen = true;

  const tick = (now) => {
    render(now);
    frame = requestAnimationFrame(tick);
  };

  const sync = () => {
    if (frame) { cancelAnimationFrame(frame); frame = 0; }
    if (reduced.matches) { render(0); return; }
    if (onScreen && !document.hidden) frame = requestAnimationFrame(tick);
  };

  layout();
  new IntersectionObserver((entries) => {
    onScreen = entries.some((e) => e.isIntersecting);
    sync();
  }).observe(canvas);
  document.addEventListener('visibilitychange', sync);
  reduced.addEventListener('change', sync);
  window.addEventListener('resize', () => {
    layout();
    if (reduced.matches || document.hidden || !onScreen) render(0);
  });
  sync();
})();
</script>
