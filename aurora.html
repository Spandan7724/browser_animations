<title>Aurora</title>
<link rel="stylesheet" href="piece.css">
<canvas id="panel"></canvas>
<script src="panel.js"></script>
<script>
(() => {
  'use strict';
  // Curtains. Each one is a line across the panel whose height is the sum of a
  // few travelling sines, drawn as a soft vertical falloff either side. Where a
  // curtain turns edge-on its own width narrows and it brightens, which is the
  // fold. Layering four at different speeds gives the drifting, sheeting look.
  const CURTAINS = [
    { y: 0.30, a1: 3.4, k1: 0.085, n1: 2, p1: 0.0, a2: 1.5, k2: 0.190, n2: 5, p2: 1.3, w: 2.2, amp: 0.68, kf: 0.23, nf: 3 },
    { y: 0.48, a1: 4.1, k1: 0.062, n1: 1, p1: 2.4, a2: 1.8, k2: 0.150, n2: 4, p2: 3.7, w: 2.8, amp: 0.44, kf: 0.17, nf: 5 },
    { y: 0.62, a1: 2.8, k1: 0.110, n1: 3, p1: 4.6, a2: 1.2, k2: 0.240, n2: 7, p2: 0.8, w: 1.8, amp: 0.56, kf: 0.31, nf: 2 },
    { y: 0.78, a1: 3.9, k1: 0.048, n1: 2, p1: 1.1, a2: 2.1, k2: 0.125, n2: 3, p2: 5.5, w: 3.4, amp: 0.34, kf: 0.13, nf: 6 },
  ];

  Panel.create({
    loop: 24,
    rows: 24, pitchX: 12, pitchY: 10, cellW: 10.5, cellH: 8.5, radius: 3,
    scaleMin: 0.42, scaleExp: 0.6, alphaMin: 0.07,

    frame(g, t) { g.w = 2 * Math.PI * t / g.loop; },

    value(g, c, r, t) {
      const x = c;
      let u = 0.05;

      for (let i = 0; i < CURTAINS.length; i += 1) {
        const q = CURTAINS[i];
        let yc = q.y * g.rows
               + q.a1 * Math.sin(q.k1 * x + q.n1 * g.w + q.p1)
               + q.a2 * Math.sin(q.k2 * x + q.n2 * g.w + q.p2);

        // The cursor takes hold of the curtain and draws it across.
        if (g.pointer.active) {
          const dx = x - g.pointer.x;
          yc += (g.pointer.y - yc) * 0.75 * Math.exp(-(dx * dx) / 70);
        }
        for (let j = 0; j < g.impulses.length; j += 1) {
          const im = g.impulses[j];
          const age = g.now - im.t0;
          if (age > 3.5) continue;
          const dx = x - im.x;
          const pull = im.strength * Math.exp(-age / 1.3) *
                       Math.exp(-(dx * dx) / (40 + 90 * age));
          yc += (im.y - yc) * 0.8 * pull;
        }

        // Slope narrows the curtain and brightens it: that is the fold turning
        // edge-on to the viewer.
        const slope = q.a1 * q.k1 * Math.cos(q.k1 * x + q.n1 * g.w + q.p1)
                    + q.a2 * q.k2 * Math.cos(q.k2 * x + q.n2 * g.w + q.p2);
        const fold = 1 / Math.sqrt(1 + slope * slope * 2.6);
        const w = q.w * (0.55 + 0.45 * fold);

        const d = r - yc;
        let b = q.amp * Math.exp(-(d * d) / (2 * w * w)) / Math.max(0.52, fold);
        // Vertical striations running down the sheet.
        b *= 0.58 + 0.42 * Math.sin(q.kf * x + q.nf * g.w + i * 1.7);
        // Fade the trailing edge downward so each sheet hangs.
        b *= d < 0 ? 1 : 0.35 + 0.65 * Math.exp(-d / 5);
        u += b;
      }
      return u;
    },
  });
})();
</script>
